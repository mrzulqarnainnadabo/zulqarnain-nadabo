name: Kaduna spatial research (manual)

on:
  workflow_dispatch:
    inputs:
      max_features:
        description: Maximum settlement features to download
        required: true
        default: "100000"
        type: string
      include_source_extract:
        description: Include the full Kaduna settlement-block source extract
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  screen:
    name: Validate and screen GRID3 settlement blocks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research workflow
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/atlas/requirements.txt
      - name: Install geospatial dependencies
        run: python -m pip install -r scripts/atlas/requirements.txt
      - name: Run Kaduna settlement screening
        run: |
          python scripts/atlas/kaduna_settlement_screening.py \
            --max-features "${{ inputs.max_features }}" \
            ${{ inputs.include_source_extract && '--include-source-extract' || '' }}
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: kaduna-settlement-screening
          path: outputs/atlas/kaduna-settlement-screening/
          if-no-files-found: error
          retention-days: 14
