name: Portfolio review build

on:
  push:
    branches:
      - feat/systems-architect-positioning
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-review-build
  cancel-in-progress: true

jobs:
  build:
    name: Build review artifact (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - name: Upload review build
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-review-build
          path: out/
          if-no-files-found: error
          retention-days: 3
